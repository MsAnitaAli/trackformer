data_root_dir: data
dataset_name: Egohumans_full-TEST
egotracks_prototype:
  data_root_dir: data/egotracks
  dataset_name: mot-egotracks-TRAIN
  deformable: true
  multi_frame: true
  tracker_cfg:
    detection_obj_score_thresh: 0.4
    track_obj_score_thresh: 0.4
frame_range:
  end: 1.0
  start: 0.0
generate_attention_maps: false
interpolate: false
load_results_dir: null
obj_detect_checkpoint_file: models/egohumans_full/checkpoint_epoch_50.pth
output_dir: results/egohumans_full_evaluation_TEST_noreid
seed: 666
tracker_cfg:
  detection_nms_thresh: 0.9
  detection_obj_score_thresh: 0.4
  inactive_patience: -1
  prev_frame_dist: 1
  public_detections: false
  reid_greedy_matching: false
  reid_score_thresh: 0.4
  reid_sim_only: false
  reid_sim_threshold: 0.0
  steps_termination: 1
  track_nms_thresh: 0.9
  track_obj_score_thresh: 0.4
verbose: false
write_images: false
