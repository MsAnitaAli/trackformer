data_root_dir: data/snakeboard
dataset_name: DEMO
egotracks_prototype:
  data_root_dir: data/egotracks
  dataset_name: mot-egotracks-TRAIN
  deformable: true
  multi_frame: true
  tracker_cfg:
    detection_obj_score_thresh: 0.4
    track_obj_score_thresh: 0.4
frame_range:
  end: 1.0
  start: 0.0
generate_attention_maps: false
interpolate: false
load_results_dir: null
obj_detect_checkpoint_file: models/egotracks_prototype/checkpoint.pth
output_dir: results/snakeboard_egotracks_606919f7_ver2
seed: 666
tracker_cfg:
  detection_nms_thresh: 0.9
  detection_obj_score_thresh: 0.01
  inactive_patience: -1
  prev_frame_dist: 1
  public_detections: false
  reid_greedy_matching: false
  reid_score_thresh: 0.4
  reid_sim_only: false
  reid_sim_threshold: 0.0
  steps_termination: 1
  track_nms_thresh: 0.9
  track_obj_score_thresh: 0.01
verbose: false
write_images: pretty
